version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spotfit-postgres
    environment:
      POSTGRES_DB: spotfit
      POSTGRES_USER: spotfit_user
      POSTGRES_PASSWORD: spotfit_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./spotfit-backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spotfit_user -d spotfit']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spotfit-redis
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./spotfit-backend
      dockerfile: Dockerfile
    container_name: spotfit-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://spotfit_user:spotfit_pass@postgres:5432/spotfit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./spotfit-backend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
